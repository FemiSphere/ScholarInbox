[project]
name = "literature-digest"
version = "0.1.0"
description = "Local daily academic literature digest workflow."
authors = [
  { name = "马心远" },
]
requires-python = ">=3.10"
dependencies = [
  # Gmail API, OAuth and proxy transport.
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
  "PySocks>=1.7",
  "requests>=2.31",
  # Configuration and paper identity matching.
  "PyYAML>=6.0",
  "rapidfuzz>=3.6",
  # Interactive terminal interface.
  "rich>=15.0,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
literature-digest = "literature_digest.cli:main"

[tool.setuptools.packages.find]
include = ["literature_digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
