name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Offline test suite
        run: python -B -m pytest -q
      - name: Offline sample digest
        run: python -B -m literature_digest --sample --dry-run --quiet --no-color --date 2099-01-01
