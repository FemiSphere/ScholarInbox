# 科研文献摘要主配置模板
#
# 使用方法：
# 1. 复制本文件为 config.local.yaml。
# 2. 只在 config.local.yaml 中修改本地真实配置。
# 3. 不要提交 config.local.yaml、credentials.json、token.json、.env、data/、outputs/。

gmail:
  # Gmail 搜索语法。默认读取所有未读邮件。
  query: "is:unread"

  # 单次最多读取多少封邮件。积压很多时建议先 30-50 封分批处理。
  max_emails_per_run: 50

  # 是否在成功处理后把邮件标记为已读。测试阶段建议 false。
  mark_as_read: false

  # 是否包含 Gmail spam/trash。通常保持 false。
  include_spam_trash: false

  # Google OAuth Desktop Client 下载得到的凭据文件。
  credentials_path: "credentials.json"

  # 首次授权后自动生成。不要手动填写，不要提交到 git。
  token_path: "token.json"

  # Gmail API 单次网络请求超时秒数。网络不稳定或代理较慢时可适当调大。
  request_timeout_seconds: 30

  # 可选：显式为 Gmail API 设置代理。留空时自动读取 shell 环境变量。
  # 示例："http://127.0.0.1:7897"
  proxy_url: ""

  # Gmail batch 会并发执行子请求；过大容易触发 per-user concurrent request 429。
  # 设为 1 可关闭 Gmail batch。
  batch_fetch_size: 10

  # 仅重试 429、5xx 和临时网络错误；永久错误不会静默跳过。
  batch_fetch_max_retries: 3
  batch_fetch_retry_backoff_seconds: 1.0

  # Gmail batchModify 单次最多处理 1000 封；不影响 dry-run 边界。
  batch_modify_size: 1000

llm:
  # 主配置只选择一个 LLM 配置文件。
  # 默认使用 Codex CLI；如需切换 DeepSeek，请改为：
  # config_path: "config/llm/deepseek.local.yaml"
  config_path: "config/llm/codex_cli.example.yaml"

research_interests:
  # 用自然语言维护近期研究兴趣。排序优先级默认来自这个文档。
  path: "research_interests.md"
  # false 时按兴趣文件内容和模型配置哈希复用画像缓存。
  refresh_each_run: false
  cache_path: "data/cache/research_interests.json"

filtering:
  skip_promotional: true
  audit_skipped_emails: true
  # 被判为推广而跳过的邮件默认保持未读，会在每次运行中重复出现并占用读取名额。
  # 设为 true 时，正式运行成功后与已处理邮件一起标为已读（日报中仍列出，便于核对）。
  mark_skipped_as_read: false
  # Google Scholar 快讯发件人已内置信任，无需加入此列表。
  academic_sender_allowlist: []
  sender_blocklist: []
  promotional_keywords:
    - sale
    - webinar
    - discount
    - offer
    - unsubscribe
    - sponsored
    - marketing

parsing:
  cache_enabled: true
  cache_dir: "data/cache/email_parsing"
  save_toc_images: true
  toc_image_dir: "data/toc_images"
  max_images_per_email: 20
  fuzzy_title_threshold: 92
  # 非 Google Scholar 的出版社/期刊/RSS 邮件，先用快速 LLM 抽取结构化论文条目。
  llm_structure_non_scholar: true

deduplication:
  # 使用轻量 JSON 身份索引进行跨日期去重；文件位于已忽略的 data/。
  registry_enabled: true
  registry_path: "data/paper_registry.json"
  # 只保留最近 30 天内再次出现过的论文，避免索引持续增长。
  retention_days: 30
  # 历史模糊匹配比单次运行更保守，并带有长度、token 和数字保护。
  fuzzy_title_threshold: 94
  # 第一次启用时，从最近 30 天的 Markdown digest 回填身份索引。
  bootstrap_from_outputs: true

digest:
  output_dir: "outputs"
  # 默认只输出 HTML。需要 Markdown 时改为 ["html", "md"]。
  output_formats: ["html"]
  # 正式运行成功后，按文件名日期删除超过 60 天的 MD/HTML 日报。
  cleanup_old_outputs: false
  # false 时，同一天多次运行不会覆盖已有 digest，而是自动追加 -2、-3。
  overwrite_existing: false
  include_low_relevance: true
  # 非学术推广或错误提取内容会归入“不相关”；HTML 中默认折叠。
  include_irrelevant: true
  language: "zh-CN"
  # 各级别最多展示的篇数。超出部分已评级但不展示，日报“运行提示”会列出被隐藏的数量；
  # 这些论文仍写入去重索引，之后不会再出现。
  max_high_relevance: 20
  max_medium_relevance: 30
  max_low_relevance: 80
  max_irrelevant: 80

safety:
  dry_run_default: true
  never_delete_emails: true
  redact_secrets_in_logs: true
  allow_sample_without_credentials: true
  allow_offline_llm_for_sample: true

progress:
  enabled: true
  show_timestamps: true

ui:
  # 交互终端显示 Rich 大标题和动态进度；重定向或非 TTY 自动降级。
  banner_enabled: true
  color_enabled: true

telemetry:
  # 终端只显示汇总；逐请求耗时、token 和缓存命中保存到独立日志。
  detailed_log_enabled: true
  log_dir: "logs/metrics"
  show_compact_summary: true

performance:
  # 整次运行预算；0 关闭。到期取消后续请求，保留缓存和指标。
  run_timeout_seconds: 900
  # LLM 请求有限并发；遇到限流可降为 2，设为 1 可恢复串行。
  parsing_max_workers: 3
  ranking_max_workers: 3
  # 每批相关性分析论文数。
  ranking_batch_size: 10
  separate_translation: true
  ranking_abstract_max_chars: 2000
  # 非 Scholar 邮件每个分块的上限；整封邮件不会仅截取前 N 字符。
  email_text_max_chars: 12000
  email_max_chunk_items: 8
  email_max_split_depth: 4
  email_max_requests_per_email: 32
  email_budget_seconds: 240
  email_max_links: 50
  email_max_images: 20

# 高/中相关论文补充摘要，失败保留初筛；仅 DeepSeek 正式运行启用。
web_enrichment:
  enabled: true
  max_papers: 30
  max_requests: 80
  max_workers: 3
  budget_seconds: 480
  paper_budget_seconds: 60
  max_retries: 0
  retrieval_budget_seconds: 360
  request_timeout_seconds: 40
  search_timeout_seconds: 12
  cache_enabled: true
  cache_path: "data/cache/web_evidence.sqlite3"
  cache_max_entries: 300
  cache_max_bytes: 8388608
  cache_ttl_days: 30
