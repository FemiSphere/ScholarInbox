# DeepSeek LLM 配置模板
#
# 使用方法：
# 1. 复制本文件为 config/llm/deepseek.local.yaml。
# 2. 在 config.local.yaml 中设置：
#    llm:
#      config_path: "config/llm/deepseek.local.yaml"
# 3. 在 .env 中填写 DEEPSEEK_API_KEY=你的真实 key。
# 4. config/llm/*.local.yaml 和 .env 已加入 .gitignore。

provider: "openai_compatible"

# 未分类请求的 socket 超时；实际等待仍受下方总预算限制。
timeout_seconds: 300
# 每次尝试的上限；整个逻辑调用（含重试与 JSON 修复）最多 120 秒。
operation_timeouts:
  email_extraction: 45
  paper_ranking: 90
request_budget_seconds: 120

# 单次模型输出 token 上限。普通文献摘要建议 3000-6000。
# 如果一次处理很多条目，可优先增加批次数，而不是无限增大本值。
max_output_tokens: 4000

# 仅相关性分析启用思考；提取与翻译保持非思考。
operation_settings:
  paper_ranking:
    thinking: enabled
    reasoning_effort: high
    max_output_tokens: 12000
    timeout_seconds: 150
    request_budget_seconds: 180
  paper_translation:
    thinking: disabled
    max_output_tokens: 4000
    timeout_seconds: 90
    request_budget_seconds: 120
  email_extraction:
    thinking: disabled
    max_output_tokens: 8000
    timeout_seconds: 45
    request_budget_seconds: 120

openai_compatible:
  # DeepSeek 官方 OpenAI-compatible base_url。
  base_url: "https://api.deepseek.com"

  # 从哪个环境变量读取 API key。不要把真实 key 写入 yaml。
  api_key_env: "DEEPSEEK_API_KEY"

  # 低成本、低延迟推荐模型。
  model: "deepseek-flash"

  # 非思考模式下生效。0.1-0.3 更适合稳定 JSON、翻译和摘要。
  temperature: 0.2

  # 本项目默认关闭思考模式，留空以免与 thinking.disabled 冲突。
  reasoning_effort: ""

  # 开启 JSON Output：请求体会包含 response_format: {"type": "json_object"}。
  response_format_json: true
  # 429、5xx 和临时网络错误使用指数退避重试。
  max_retries: 1
  retry_backoff_seconds: 1.0

  # DeepSeek v4 默认开启思考模式。此处关闭思考模式以降低延迟和成本。
  extra_body:
    thinking:
      type: "disabled"
